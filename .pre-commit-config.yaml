repos:
    -   repo: https://github.com/pre-commit/mirrors-clang-format
        rev: v18.1.3
        hooks:
            -   id: clang-format
                name: clang-format (C/C++)
                files: \.(c|cc|cpp|cxx|h|hpp)$
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        rev: v0.8.6
        hooks:
            -   id: ruff
                args: [ --fix ]
            -   id: ruff-format
