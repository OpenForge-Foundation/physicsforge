name: Python Distro Check

on:
    push:
        branches: [ master, develop ]
    pull_request:
        branches: [ master, develop ]

jobs:
    wheel:
        name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest ]
                python-version: [ '3.10', '3.12', '3.14' ]

        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v5
                with:
                    python-version: ${{ matrix.python-version }}

            -   name: Install build dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install build pytest

            -   name: Build wheel
                run: python -m build --wheel

            -   name: Install wheel
                shell: bash
                run: pip install dist/*.whl --force-reinstall

            -   name: Run tests against the installed wheel
                # Run from a neutral directory so the installed package, not ./python, is imported.
                shell: bash
                run: |
                    cd "$RUNNER_TEMP"
                    python -m pytest "$GITHUB_WORKSPACE/python/tests" -p no:cacheprovider -o addopts="" --rootdir "$RUNNER_TEMP"
                    python -m pytest --doctest-modules --pyargs physicsforge -p no:cacheprovider -o addopts="" --rootdir "$RUNNER_TEMP"
