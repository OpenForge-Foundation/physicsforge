name: C++ Tests

on:
    push:
    pull_request:
        branches: [ main, develop ]
    workflow_dispatch:

jobs:
    ctest:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]

        steps:
            -   uses: actions/checkout@v4

            -   name: Configure
                run: >
                    cmake -S . -B build
                    -DCMAKE_BUILD_TYPE=Release
                    -DPHYSICSFORGE_BUILD_PYTHON=OFF
                    -DPHYSICSFORGE_BUILD_C_SHARED=ON
                    -DPHYSICSFORGE_WARNINGS_AS_ERRORS=ON

            -   name: Build
                run: cmake --build build --config Release --parallel

            -   name: Test
                run: ctest --test-dir build -C Release --output-on-failure
