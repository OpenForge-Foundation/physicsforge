[build-system]
# setup.py shells out to cmake, so it is a build dependency; ninja is only used off Windows.
requires = [
    "setuptools>=77",
    "wheel",
    "pybind11>=2.12",
    "cmake>=3.20",
    "ninja; sys_platform != 'win32'",
]
build-backend = "setuptools.build_meta"

[project]
name = "physicsforge"
dynamic = ["version"]
description = "Fast, validated physics: a C++20 core with typed, vectorised Python bindings."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "OpenForge Foundation" }]
dependencies = ["numpy>=1.24"]
keywords = ["physics", "mechanics", "electromagnetism", "thermodynamics", "numerics", "pybind11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/OpenForge-Foundation/physicsforge"
Issues = "https://github.com/OpenForge-Foundation/physicsforge/issues"

[tool.pytest.ini_options]
testpaths = ["tests/python", "python/physicsforge"]
addopts = "--doctest-modules -ra"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "NUMBER"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["python"]
# Generated by pybind11-stubgen; force-exclude keeps pre-commit from passing it in by name.
extend-exclude = ["python/physicsforge/_physicsforge.pyi"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "D"]
# D401/D403: summaries are noun phrases ("Kinetic energy ...", "de Broglie ...") by design.
ignore = ["D105", "D107", "D401", "D403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/python/*" = ["D"]
"setup.py" = ["D"]

[tool.mypy]
files = ["python/physicsforge"]

# The stub is generated by pybind11-stubgen and checked in CI, so it is never hand-edited.
# pybind11 types Vector3's ==/!= by operand and sets __hash__ = None, both valid at runtime.
[[tool.mypy.overrides]]
module = "physicsforge._physicsforge"
disable_error_code = ["assignment", "override"]
